<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- Metas -->
    <meta name="description"
        content="A browser-only demo of Noffle My Needs: an office map-style site which allows all employees to express their needs through the workday, to create a fully accessible workplace.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <!-- Local stylesheets -->
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <!-- Bootstrap and Font Awesome, served from this site -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

    <title>Noffle My Needs</title>
</head>

<body>

    <!--Navbar-->
    <nav class="navbar navbar-expand-lg fixed-top" id="site-nav"></nav>

    <main class="container mt-4">

        <div id="demo-banner" class="demo-banner">
            <noscript><p class="mb-0">This demo needs JavaScript to work.</p></noscript>
        </div>

        <!-- Flash messages -->
        <section id="flash"></section>

        <!-- Main content container -->
        <div>
            <h2 class="text-center">Set My Noffles</h2>
            <hr>
            <p class="text-center">To set a Noffle, click on the card. You can also choose whether you would like it to be private or public.</p>
            <p class="text-center">Public Noffles can be seen by everyone on the site. Private Noffles can only be seen by your managers.</p>
            <div class="container">
                <div class="row">
                    <h3 class="text-center py-4">Permanent Noffles</h3>
                    <div class="row" id="permanent-noffles"></div>
                </div>

                <div class="row mt-2">
                    <h3 class="text-center py-4">Temporary Noffles</h3>
                    <div class="row" id="temporary-noffles"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed-bottom align-middle" id="site-footer"></footer>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="js/pages/set-noffles.js"></script>
</body>

</html>
