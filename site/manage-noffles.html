<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- Metas -->
    <meta name="description"
        content="A browser-only demo of Noffle My Needs: an office map-style site which allows all employees to express their needs through the workday, to create a fully accessible workplace.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <!-- Local stylesheets -->
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <!-- Bootstrap and Font Awesome, served from this site -->
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

    <title>Manage Noffles | Noffle My Needs demo</title>
</head>

<body>

    <!-- Skip link: lets keyboard users jump past the navbar -->
    <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to main content</a>

    <!--Navbar-->
    <nav class="navbar navbar-expand-lg" id="site-nav"></nav>

    <main class="container mt-4" id="main-content" tabindex="-1">

        <div id="demo-banner" class="demo-banner">
            <noscript><p class="mb-0">This demo needs JavaScript to work.</p></noscript>
        </div>

        <!-- Flash messages -->
        <section id="flash"></section>

        <!-- Main content container -->
        <div>
            <h1 class="text-center">Manage Noffles</h1>
            <hr>
            <div class="container">
                <div class="row">
                    <div class="col-6 offset-3">
                        <a class="btn btn-green fw-bold pt-2 w-100 mb-4 tap-target" href="new-noffle.html">
                            Add New Noffle
                        </a>
                    </div>
                </div>
                <div class="row" id="noffle-list"></div>
            </div>

            <!-- Asks before deleting a Noffle, as it can't be undone (WCAG 3.3.4) -->
            <div class="modal fade" id="delete-noffle-modal" tabindex="-1" aria-labelledby="delete-noffle-title" aria-describedby="delete-noffle-detail" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2 class="modal-title" id="delete-noffle-title">Delete this Noffle?</h2>
                            <button type="button" class="close tap-target" data-bs-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true"><i class="fas fa-2x fa-times"></i></span>
                            </button>
                        </div>
                        <div class="modal-body">
                            <p id="delete-noffle-detail"></p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-blue tap-target" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-red tap-target" id="confirm-delete-noffle">Delete Noffle</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="align-middle" id="site-footer"></footer>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="js/pages/manage-noffles.js"></script>
</body>

</html>
